<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#081420"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="420" rx="22" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1100" height="420" rx="22" fill="url(#glow1)"/>
  <rect width="1100" height="420" rx="22" fill="url(#glow2)"/>

  <!-- Top Pill -->
  <rect x="210" y="32" width="680" height="34" rx="17" fill="#130d26" stroke="#7000ff" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="550" y="54" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    Producto Personal de Ariel Castro Cavadía • Versión Lite de Software Libre (ES | EN)
  </text>

  <!-- Main Title -->
  <text x="550" y="118" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Tu Mac, tu Código y tus Agentes,
  </text>
  <text x="550" y="166" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    al Mando desde tu Celular
  </text>

  <!-- Subtitle -->
  <text x="550" y="210" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    Controla tu Mac desde el gym, el auto o desde donde quieras.
  </text>
  <text x="550" y="236" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" text-anchor="middle">
    Desarrollo personal de Ariel Castro Cavadía para la comunidad de Software Libre (Versión Lite derivada de Rocket Launch).
  </text>
  <text x="550" y="260" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" text-anchor="middle">
    Habla por voz, texto, imágenes o video en Telegram con Iris (al mando), Dante (arquitectura) y Cerberus (seguridad)
  </text>
  <text x="550" y="284" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">
    para programar, usar el navegador, ejecutar tareas en tu Mac o subir apps al App Store sin abrir una sola pantalla.
  </text>

  <!-- Bottom Feature Pills -->
  <rect x="85" y="330" width="290" height="38" rx="19" fill="#071f29" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
  <text x="230" y="354" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    Sin IDE ni Terminal abiertos
  </text>

  <rect x="395" y="330" width="310" height="38" rx="19" fill="#160d29" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
  <text x="550" y="354" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    Voz, Texto, Imágenes y Video en Telegram
  </text>

  <rect x="725" y="330" width="290" height="38" rx="19" fill="#07221b" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1"/>
  <text x="870" y="354" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    Instalación en 3 minutos
  </text>
</svg>