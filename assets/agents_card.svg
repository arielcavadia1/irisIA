<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%">
  <defs>
    <clipPath id="clipIris"><rect x="32" y="68" width="332" height="202" rx="14"/></clipPath>
    <clipPath id="clipDante"><rect x="384" y="68" width="332" height="202" rx="14"/></clipPath>
    <clipPath id="clipCerb"><rect x="736" y="68" width="332" height="202" rx="14"/></clipPath>
  </defs>
  <rect width="1100" height="300" rx="20" fill="#0b101c" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="17.5" font-weight="800">
    Tus 3 Agentes en Telegram (Iris siempre al mando) • Your 3-Agent Squad
  </text>
  <rect x="850" y="22" width="216" height="28" rx="14" fill="#071f29" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
  <text x="958" y="40" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">
    JERARQUÍA DE MANDO
  </text>

  <!-- Card 1: Iris -->
  <rect x="32" y="68" width="332" height="202" rx="14" fill="#070a12" stroke="#00f2fe" stroke-opacity="0.45" stroke-width="1.4"/>
  <g clip-path="url(#clipIris)">
    <text x="50" y="100" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
      1. Iris — Líder Operativa (Al Mando)
    </text>
    <text x="50" y="130" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      Está siempre al mando. Recibe tus notas
    </text>
    <text x="50" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      de voz, textos, fotos o videos en Telegram,
    </text>
    <text x="50" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      edita código, controla tu Mac, opera el
    </text>
    <text x="50" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      navegador, sube apps al App Store y
    </text>
    <text x="50" y="210" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" font-weight="600">
      coordina a Dante y a Cerberus.
    </text>
  </g>

  <!-- Card 2: Dante -->
  <rect x="384" y="68" width="332" height="202" rx="14" fill="#070a12" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.4"/>
  <g clip-path="url(#clipDante)">
    <text x="402" y="100" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
      2. Dante — Arquitecto (/plan)
    </text>
    <text x="402" y="130" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      Cuando quieres planear antes de programar,
    </text>
    <text x="402" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      Dante revisa tu proyecto en modo solo
    </text>
    <text x="402" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      lectura sin modificar ningún archivo y te
    </text>
    <text x="402" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      arma el plan paso a paso para que tú
    </text>
    <text x="402" y="210" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" font-weight="600">
      apruebes su ejecución con un toque.
    </text>
  </g>

  <!-- Card 3: Cerberus -->
  <rect x="736" y="68" width="332" height="202" rx="14" fill="#070a12" stroke="#f87171" stroke-opacity="0.45" stroke-width="1.4"/>
  <g clip-path="url(#clipCerb)">
    <text x="754" y="100" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
      3. Cerberus — Seguridad (/cerberus)
    </text>
    <text x="754" y="130" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      Encargado de lo básico de ciberseguridad
    </text>
    <text x="754" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      (llaves expuestas, archivos .env, permisos
    </text>
    <text x="754" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.2">
      y vulnerabilidades básicas). Solo actúa
    </text>
    <text x="754" y="190" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" font-weight="600">
      cuando tú se lo pides para recomendar y
    </text>
    <text x="754" y="210" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" font-weight="600">
      aprobar planes o ejecuciones.
    </text>
  </g>
</svg>